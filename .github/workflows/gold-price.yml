name: Post gold price to Telegram

on:
  schedule:
    - cron: "0 * * * *"   # هر ساعت، سر ساعت
  workflow_dispatch: {}       # اجازهی اجرای دستی از تب Actions، برای تست

jobs:
  post-price:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the bot
        env:
          GOLD_API_KEY: ${{ secrets.GOLD_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BRSAPI_KEY: ${{ secrets.BRSAPI_KEY }}
        run: python project.py

      - name: Commit and push price history
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add gold_price_history.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "update gold price history [skip ci]" && git push)
